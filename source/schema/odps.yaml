$schema: "https://json-schema.org/draft/2020-12/schema"
title: ODPS 4.2 Schema
type: object
required: [schema, version, product]
properties:
  schema:
    type: string
    format: uri
  version:
    type: [string, number]
  product:
    type: object
    required: [details]
    properties:
      contract:
        type: object
        $ref: "#/$defs/ContractConfiguration"

      details:
        type: object
        properties:
          en:
            type: object
            required: [name, productID, valueProposition, description, visibility, status, productVersion]
            properties:
              name:
                type: string
              productID:
                type: string
              governanceProfile:
                description: Indicates the governance maturity applied to the data product. The value describes the expected level of governance enforcement, automation, and operational control associated with the product.
                type: string
                enum:
                  - structured
                  - enforced
                  - automated
                  - audit_ready
              portfolioPriority:
                description: Indicates the importance of the data product within the organization's data product portfolio.
                type: string
                enum:
                  - critical
                  - high
                  - medium
                  - low
              valueProposition:
                type: string
              description:
                type: string
              visibility:
                type: string
              status:
                type: string
              productVersion:
                type: string

      productStrategy:
        type: object
        properties:
          status:
            type: string
            enum:
              - Planned
              - Active
              - At Risk
              - Achieved
              - Partially Achieved
              - Cancelled
              - Expired
          
          startDate:
            type: string
            format: date
            description: Date when the product strategy becomes active. Use ISO 8601, (YYYY-MM-DD).

          endDate:
            type: string
            format: date
            description: Date when the product strategy ends or is planned to end. Use ISO 8601, (YYYY-MM-DD).

          objectives:
            type: array
            items:
              type: object
              properties:
                en:
                  type: string

          strategicAlignment:
            type: array
            items:
              type: object
              properties:
                en:
                  type: string

          contributesToKPI:
            type: object
            required: [id, name, unit, target]
            properties:
              id:
                type: string
              name:
                type: string
              description:
                type: string
              unit:
                type: string
              target:
                type: [number, string]
              direction:
                type: string
                enum: [increase, decrease, at_least, at_most, equals]
              timeframe:
                type: string

          productKPIs:
            type: array
            items:
              type: object
              required: [id, name, unit, target]
              properties:
                id:
                  type: string
                name:
                  type: string
                description:
                  type: string
                unit:
                  type: string
                target:
                  type: [number, string]
                direction:
                  type: string
                  enum: [increase, decrease, at_least, at_most, equals]
                frequency:
                  type: string
                owner:
                  type: string
                calculation:
                  type: string

          relatedKPIs:
            type: array
            items:
              type: object
              required: [id, name, unit, target]
              properties:
                id:
                  type: string
                name:
                  type: string
                unit:
                  type: string
                target:
                  type: [number, string]
                direction:
                  type: string
                  enum: [increase, decrease, at_least, at_most, equals]

      pricingPlans:
        type: object
        properties:
          declarative:
            type: object
            properties:
              en:
                type: array
                items:
                  type: object
                  required: [name]

      SLA:
        type: object
        properties:
          declarative:
            type: object
            additionalProperties:
              type: object
              properties:
                name:
                  type: object
                  properties:
                    en:
                      type: string
                dimensions:
                  type: array
                  items:
                    type: object
                    required: [dimension, objective, unit]
                    properties:
                      dimension:
                        type: string
                      objective:
                        type: integer
                      unit:
                        type: string
                      weight:
                        type: integer
                        description: Relative importance of this dimension for product-level scoring. User-editable integer (no decimals).
          executable:
            type: array
            items:
              type: object
          support:
            type: object
            required: [phoneNumber, email]

      dataQuality:
        type: object
        properties:
          declarative:
            type: object
            additionalProperties:
              type: object
              properties:
                displaytitle:
                  type: object
                  properties:
                    en:
                      type: string
                dimensions:
                  type: array
                  items:
                    type: object
                    required: [dimension, objective, unit]
                    properties:
                      dimension:
                        type: string
                      objective:
                        type: integer
                      unit:
                        type: string
                      weight:
                        type: integer
                        description: Relative importance of this dimension for product-level scoring. User-editable integer (no decimals).
          executable:
            type: array
            items:
              type: object
              properties:
                dimension:
                  type: string
                type:
                  type: string
                  enum:
                    - SodaCL
                    - Montecarlo
                    - DQOps
                    - Great Expectations
                    - OpenMetadata
                    - Custom
                version:
                  type: string
                reference:
                  type: string
                  format: uri
                spec:
                  type: object

      dataAccess:
        type: object
        $ref: "#/$defs/DataAccess"

      paymentGateways:
        type: object
        additionalProperties:
          type: object
          required: [type, version]

      license:
        type: object
        properties:
          en:
            type: object
            required: [scope, termination, governance]

      dataHolder:
        type: object
        properties:
          en:
            type: object
            required: [legalName]

$defs:
  Contract:
    type: object
    description: Defines one data contract, either by external reference, metadata and URL, or inline specification.
    properties:
      $ref:
        type: string
        format: uri-reference
        description: Points to the content of this individual contract profile in a local or external file.
      id:
        type: string
        description: UUID of the data contract.
      type:
        type: string
        description: Defines the standard used in the data contract.
        enum: [ODCS, DCS]
      contractVersion:
        type: string
        description: Version of the standard used to define the Data Contract.
      contractURL:
        type: string
        format: uri
        description: URL pointing to a data contract in a contract management service or similar system.
      spec:
        type: object
        description: Inline YAML element containing data contract details.
    minProperties: 1
    additionalProperties: false

  ContractProfilePackageReference:
    type: object
    description: References an external package containing named data contract profiles. The referenced package must contain a default profile.
    properties:
      $ref:
        type: string
        format: uri-reference
    required: [$ref]
    additionalProperties: false

  ContractProfileCollection:
    type: object
    description: Inline collection of one or more named data contract profiles. The default profile is required.
    properties:
      default:
        $ref: "#/$defs/Contract"
    required: [default]
    additionalProperties:
      $ref: "#/$defs/Contract"

  ContractProfiles:
    description: Named data contract profiles defined inline or supplied as an external package.
    oneOf:
      - $ref: "#/$defs/ContractProfileCollection"
      - $ref: "#/$defs/ContractProfilePackageReference"

  ContractConfiguration:
    description: A legacy singleton contract or the recommended named contract profile collection.
    oneOf:
      - allOf:
          - $ref: "#/$defs/Contract"
          - not:
              required: [$ref]
      - $ref: "#/$defs/ContractProfiles"

  ContractReference:
    type: object
    description: Reference from a Data Access profile to a named data contract profile.
    properties:
      $ref:
        type: string
        format: uri-reference
    required: [$ref]
    additionalProperties: false

  DataAccess:
    type: object
    description: Named data access definitions, commonly including default.
    additionalProperties:
      $ref: "#/$defs/DataAccessItem"

  DataAccessItem:
    type: object
    required: [outputPortType]
    properties:
      name:
        type: object
      description:
        type: object
      outputPortType:
        type: string
      format:
        type: string
        enum: [TOON, JSON, XML, CSV, Excel, zip, plain text, GraphQL, MCP]
      authenticationMethod:
        type: string
        enum: [OAuth, Token, API key, HTTP Basic, none]
      specification:
        type: string
        enum: [OAS, RAML, Slate, MCP]
      specsURL:
        type: string
        format: uri
      accessURL:
        type: string
        format: uri
      documentationURL:
        type: string
        format: uri
      contract:
        $ref: "#/$defs/ContractReference"
      hashType:
        type: string
      checksum:
        type: string
